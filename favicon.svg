<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19232f"/>
      <stop offset="100%" stop-color="#0c1117"/>
    </linearGradient>
    <linearGradient id="initGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#384a5e" stroke-width="2.5"/>
  
  <!-- Top Self-Loop on Initial State -->
  <path d="M 19 25 C 13 13, 29 13, 24 24" fill="none" stroke="#68a0d0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="22,22 26,25 23,28" fill="#68a0d0"/>
  
  <!-- Forward Transition Curve -->
  <path d="M 27 34 Q 35 27 41 33" fill="none" stroke="#e0e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="38,30 43,34 38,36" fill="#e0e8f0"/>

  <!-- Initial Incoming Green Arrow -->
  <path d="M 6 36 L 14 36" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="12,32 17,36 12,40" fill="#2ecc71"/>

  <!-- Initial State q0 (Green) -->
  <circle cx="21" cy="36" r="8" fill="url(#initGrad)" stroke="#165934" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Final State q1 (Yellow with accepting inner ring) -->
  <circle cx="47" cy="36" r="8.5" fill="url(#finGrad)" stroke="#8e6a00" stroke-width="2" filter="url(#glow)"/>
  <circle cx="47" cy="36" r="5.5" fill="none" stroke="#ffffff" stroke-width="1.6"/>
</svg>
